<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Rand Alharkan" />
    <meta name="description" content="Application to study using flash cards" />
    <meta name="keyword" content="study aids, flashcards, learning materials" />
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="assets/vendor/normalize.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <script type="module" src="./assets/js/index.js"></script>
    <title>Flash Cards</title>
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a href="/" class="header__link">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li><a href="/" class="nav__link">My Decks</a></li>
          <li><a href="" class="nav__link">About</a></li>
          <!-- <li><a href="/carousel.html" class="nav__link">carousel</a></li> -->
        </ul>
      </nav>
    </header>
    <main class="page__main-content">
      <section id="decks" class="decks">
        <h2 class="decks__title">My Decks</h2>
        <div class="wrapping-row">
          <ul class="decks__list wrapping-row__display-contents">
            <template id="deckTemplate">
              <li class="deck">
                <a href="#" class="deck__link"></a>
                <h2 class="deck__title"></h2>
                <div class="deck__row">
                  <p class="deck__count"></p>
                  <button
                    class="deck__delete-btn"
                    aria-label="delete this deck"
                    type="button"
                  ></button>
                </div>
              </li>
            </template>
          </ul>
          <button
            class="decks__new-deck-btn"
            aria-label="add new deck"
            type="button"
          >
            + New Deck
          </button>
        </div>
      </section>

      <section id="not-found" class="not-found">
        <h2 class="not-found__status-code">404</h2>
        <p class="not-found__text">Sorry, nothing found!</p>
      </section>

      <section id="carousel" class="carousel">
        <h2 class="carousel__title">HTML Tags Deck &middot; 1/10</h2>
        <div class="carousel__row">
          <button
            type="button"
            aria-label="Go to previous card in deck"
            class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
          ></button>
          <div class="carousel__card">
            <p class="carousel__card-text">&lt;body&gt; &lt;/body&gt;</p>
          </div>
          <button
            type="button"
            aria-label="Go to next card in deck"
            class="carousel__btn carousel__btn_type_right"
          ></button>
        </div>
        <button
          type="button"
          aria-label="flip the deck"
          class="carousel__btn carousel__btn_type_flip"
        ></button>
      </section>
    </main>
    <footer class="footer">
      <p class="footer__text">&copy; Rand Alharkan 2026</p>
    </footer>
  </body>
</html>
